<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` is Chrome-on-Android-only (108+);
      iOS Safari silently ignores it — the virtual keyboard always overlays
      the viewport there. Keyboard-aware layout on iOS requires the
      VirtualKeyboard API or `visualViewport` resize events instead.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Status bar color follows the active theme; the inline script below
      updates this meta tag in the same tick it applies the theme class so
      mobile browsers never flash the default (white) bar.
    -->
    <meta name="theme-color" content="#0d0d0d" />
    <title>Canopy Code Web chat</title>
    <!--
      Apply the stored theme class + theme-color before first paint so the
      <html> background matches the app theme on mobile. Without this, the
      iOS Safari rubber-band overscroll and the status-bar / home-indicator
      safe areas briefly show the default white canvas. Storage key mirrors
      THEME_STORAGE_KEY in main.tsx.
    -->
    <script>
      !(function () {
        try {
          var k = 'qwen-code-web-shell-theme',
            p = new URLSearchParams(location.search),
            t = p.get('theme');
          if (t !== 'dark' && t !== 'light') {
            try {
              t = localStorage.getItem(k);
            } catch (_) {
              t = null;
            }
          }
          if (t !== 'dark' && t !== 'light') t = 'dark';
          document.documentElement.classList.add('theme-' + t);
          var m = document.querySelector('meta[name=theme-color]');
          if (m)
            m.setAttribute('content', t === 'light' ? '#ffffff' : '#0d0d0d');
        } catch (e) {
          console.warn('theme-init:', e);
        }
      })();
    </script>
    <!--
      Favicon is inlined as a data: URI rather than a /favicon.svg file because
      the daemon's static server only exposes /assets/* and / (see
      packages/cli/src/serve/web-shell-static.ts) — a file at the dist root
      would never be reachable. The data: URI is allowed by the shell CSP
      (img-src 'self' data: blob:). This is the same Canopy tree path used by
      the iOS/web brand asset, with a fixed forest-green fill for browser tabs.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%20100%20100%22%20fill%3D%22%234A7C4A%22%3E%3Cpath%20d%3D%22M47.8%2C0.1%20L53.2%2C0.2%20L59.3%2C2.1%20L65.0%2C6.0%20L70.1%2C12.3%20L76.8%2C13.8%20L81.7%2C16.5%20L86.4%2C21.8%20L89.1%2C29.2%20L96.0%2C34.4%20L99.3%2C40.2%20L99.9%2C45.8%20L98.8%2C50.7%20L96.1%2C55.1%20L91.9%2C58.5%20L85.6%2C60.3%20L77.6%2C59.2%20L71.8%2C62.2%20L67.2%2C63.3%20L62.6%2C63.1%20L58.4%2C62.0%20L57.5%2C62.7%20L57.5%2C76.3%20L58.9%2C81.9%20L61.7%2C86.0%20L65.6%2C89.6%20L77.7%2C96.0%20L78.1%2C98.4%20L76.0%2C99.8%20L62.7%2C97.8%20L50.9%2C97.2%20L38.6%2C97.7%20L24.5%2C99.8%20L22.8%2C99.4%20L21.7%2C97.7%20L22.4%2C95.9%20L34.2%2C89.7%20L38.2%2C86.1%20L40.9%2C82.3%20L42.5%2C76.5%20L42.5%2C62.6%20L41.5%2C62.0%20L37.3%2C63.1%20L32.9%2C63.3%20L28.1%2C62.1%20L22.6%2C59.2%20L15.4%2C60.4%20L10.8%2C59.7%20L7.3%2C58.1%20L4.2%2C55.5%20L2.0%2C52.3%20L0.5%2C48.8%20L0.1%2C43.0%20L1.8%2C37.4%20L5.2%2C33.1%20L10.8%2C29.3%20L13.1%2C22.8%20L16.4%2C18.2%20L22.2%2C14.2%20L30.0%2C12.2%20L34.3%2C6.7%20L39.1%2C2.9%20L43.2%2C1.1%20L47.7%2C0.1%20Z%22%2F%3E%3C%2Fsvg%3E"
    />
  </head>
  <body>
    <!--
      Prevent React 19 dev-mode OOM crashes. React records component prop
      details through performance.measure(), which structured-clones and retains
      those details. Strip the detail before large transcripts reach the native
      call while preserving the component timing and non-React measures.
    -->
    <script>
      !(function () {
        if (typeof performance === 'undefined' || !performance.measure) return;
        var m = performance.measure.bind(performance);
        performance.measure = function () {
          var options = arguments[1];
          var devtools =
            options &&
            typeof options === 'object' &&
            options.detail &&
            options.detail.devtools;
          if (devtools && devtools.track === 'Components ⚛') {
            var args = Array.prototype.slice.call(arguments);
            args[1] = Object.assign({}, options, { detail: null });
            return m.apply(this, args);
          }
          return m.apply(this, arguments);
        };
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
