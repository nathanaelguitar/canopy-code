[workspace]
resolver = "2"
members = [
    "crates/canopy-core",
    "crates/canopy-cli",
    "crates/canopy-sdk",
    "crates/mobile-mcp",
    "crates/canopy-audio-capture",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
aes = "0.8.4"
aes-gcm = "0.11.1"
base64 = "0.22"
bytes = "1"
chardetng = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
regex = "1"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
url = "2.5"
sha2 = "0.10"
scrypt = { version = "0.12", default-features = false }
sha1 = "0.11"
hmac = "0.12"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jpeg-encoder = "=0.7.1"
thiserror = "2"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
mime_guess = "2"
md-5 = "0.11.0"
jsonrepair-rs = "0.2"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
globset = "0.4"
walkdir = "2"
similar = "2.7"
unicode-normalization = "0.1.25"
yaml_serde = "0.10.7"
toml = "0.9.12"
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }
nix = { version = "0.31", features = ["hostname", "process", "signal", "user"] }
security-framework = "3.7.0"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
