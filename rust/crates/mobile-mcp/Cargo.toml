[package]
name = "mobile-mcp"
version = "0.20.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
ctrlc = { version = "3.4", features = ["termination"] }
regex = "1"
reqwest = { workspace = true, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2.workspace = true
wait-timeout = "0.2"
uuid = { workspace = true }
zip = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
