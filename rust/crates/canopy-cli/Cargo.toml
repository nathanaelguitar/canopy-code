[package]
name = "canopy-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
base64.workspace = true
bytes.workspace = true
canopy-audio-capture = { path = "../canopy-audio-capture" }
canopy-core = { path = "../canopy-core" }
chrono.workspace = true
ctrlc = "3.4"
crossterm = "0.28"
futures-util.workspace = true
flate2.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server-graceful", "tokio"] }
indexmap.workspace = true
nix.workspace = true
reqwest.workspace = true
ring = "0.17"
regex.workspace = true
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde.workspace = true
serde_json.workspace = true
semver = "1"
sha2.workspace = true
tar.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tokio-tungstenite.workspace = true
unicode-normalization.workspace = true
url.workspace = true
uuid.workspace = true
walkdir.workspace = true
zip.workspace = true
